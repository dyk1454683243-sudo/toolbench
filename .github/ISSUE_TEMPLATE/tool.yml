name: Tool proposal
description: A tool to ship in this repository
labels: ["type: enhancement", "area: tools"]
body:
  - type: markdown
    attributes:
      value: |
        Tools here exist to exercise the runtime, not to be a collection. A new one needs to cover
        something `percentiles` and `queue-explorer` do not. See CONTRIBUTING.md.
  - type: input
    id: what
    attributes:
      label: What it computes
      description: One sentence, the way the tool's own blurb would say it.
    validations:
      required: true
  - type: textarea
    id: covers
    attributes:
      label: What it exercises that nothing else does
      description: A new output kind, a failure mode the bench cannot currently produce, a different input shape.
    validations:
      required: true
  - type: input
    id: kinds
    attributes:
      label: Output kinds
      placeholder: "group of fields + table, plus error"
    validations:
      required: true
  - type: dropdown
    id: thread
    attributes:
      label: Thread
      options:
        - "main (running time does not depend on the input)"
        - "worker (running time depends on the input)"
    validations:
      required: true
