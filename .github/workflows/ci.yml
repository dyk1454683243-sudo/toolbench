name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          # 22.6+ runs TypeScript directly, which is how tool fixtures execute with no build step.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit tests and every tool's fixtures
        # ⚠️ This is the load-bearing compatibility check: EVERY tool's fixtures run against the
        # current SDK and runtime. If a change breaks a tool written against an older contract
        # version, it fails here — which is what makes backward compatibility a tested claim.
        run: pnpm test
      - run: pnpm build
      - name: Build the bench
        run: pnpm bench:build
      - name: The runtime, in a real browser
        run: |
          pnpm exec playwright install --with-deps chromium
          CHROME_CHANNEL=chromium pnpm test:bench
